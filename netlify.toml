  # NUNCA poner acá la secret / service_role key.
  VITE_SUPABASE_URL = "https://evwoxjmpbrvcfadnzitr.supabase.co"
  VITE_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV2d294am1wYnJ2Y2ZhZG56aXRyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ5Mjg4NTUsImV4cCI6MjExMDUwNDg1NX0.TCsbJOfNImN4Kmie_8hCs1IV_YR0cq-K1ClFD24Rkls"

# SPA: todas las rutas (incluida /r/:token del reporte público) sirven index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
